<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poster Maker Pro | Tool Sathi</title>
<meta name="description" content="Tool Sathi Free Online Poster, Thumbnail और Status Maker">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f3f6ff;
    color:#172033;
}

.navbar{
    background:linear-gradient(135deg,#2563eb,#7c3aed,#db2777);
    color:white;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 5px 20px rgba(0,0,0,.18);
}

.logo{
    font-size:21px;
    font-weight:900;
}

.home-btn{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.18);
    padding:9px 15px;
    border-radius:25px;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:30px 15px 25px;
    background:linear-gradient(135deg,#eef4ff,#fff0fb);
}

.hero h1{
    font-size:30px;
    margin-bottom:8px;
}

.hero p{
    color:#5d6678;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px 14px 40px;
}

.editor{
    display:grid;
    grid-template-columns:370px 1fr;
    gap:20px;
}

.controls,
.preview-card{
    background:white;
    padding:20px;
    border-radius:22px;
    box-shadow:0 8px 28px rgba(30,50,100,.11);
}

.controls h2,
.preview-card h2{
    margin-bottom:18px;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:14px;
}

textarea,
input[type="text"],
input[type="number"],
select{
    width:100%;
    padding:11px 12px;
    border:1px solid #d9dfeb;
    border-radius:11px;
    outline:none;
    font-size:15px;
}

textarea{
    height:85px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#6366f1;
}

input[type="range"]{
    width:100%;
}

.range-value{
    font-size:13px;
    color:#64748b;
    margin-top:4px;
}

.color-row{
    display:flex;
    gap:10px;
    align-items:center;
}

input[type="color"]{
    width:55px;
    height:42px;
    border:none;
    padding:2px;
    border-radius:9px;
}

input[type="file"]{
    width:100%;
    padding:10px;
    border:1px dashed #b8c1d6;
    border-radius:10px;
    background:#f8faff;
}

.style-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.style-btn{
    border:1px solid #dce2ef;
    background:#f8faff;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.style-btn.active{
    background:#6366f1;
    color:white;
    border-color:#6366f1;
}

.bg-options{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.bg-btn{
    border:1px solid #ddd;
    padding:8px 12px;
    border-radius:20px;
    background:white;
    cursor:pointer;
}

.bg-btn:hover{
    background:#eef2ff;
}

.gradient-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.btn{
    width:100%;
    border:none;
    padding:13px;
    border-radius:13px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:7px;
}

.generate{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.download{
    background:linear-gradient(135deg,#059669,#0d9488);
}

.jpg{
    background:linear-gradient(135deg,#ea580c,#dc2626);
}

.reset{
    background:#475569;
}

.btn:active{
    transform:scale(.98);
}

.canvas-box{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:auto;
    background:
        repeating-conic-gradient(#e5e7eb 0% 25%,white 0% 50%)
        50% / 20px 20px;
    padding:18px;
    border-radius:16px;
    min-height:400px;
}

canvas{
    width:100%;
    max-width:650px;
    height:auto;
    display:block;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.size-info{
    background:#eef2ff;
    color:#4338ca;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:13px;
    font-weight:bold;
}

footer{
    text-align:center;
    background:#111827;
    color:#dbe3f2;
    padding:25px 15px;
}

.copyright{
    margin-top:8px;
    color:#9ca3af;
    font-size:13px;
}

@media(max-width:850px){
    .editor{
        grid-template-columns:1fr;
    }

    .controls{
        order:1;
    }

    .preview-card{
        order:2;
    }

    .hero h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">🔧 Tool Sathi</div>
    <a href="index.html" class="home-btn">🏠 Home</a>
</nav>

<section class="hero">
    <h1>🎨 Poster Maker Pro</h1>
    <p>Poster • Thumbnail • Story • Status — सब कुछ Free में बनाएं</p>
</section>

<div class="container">

<div class="editor">

<!-- CONTROLS -->
<div class="controls">

<h2>🛠️ Design Settings</h2>

<div class="field">
<label>📐 Design Size</label>

<select id="posterSize">
<option value="youtube">▶️ YouTube Thumbnail — 1280 × 720</option>
<option value="shorts">📱 YouTube Shorts — 1080 × 1920</option>
<option value="story">📖 Instagram / WhatsApp Story — 1080 × 1920</option>
<option value="square">⬜ Instagram Square — 1080 × 1080</option>
<option value="portrait">📸 Instagram Portrait — 1080 × 1350</option>
<option value="facebook">📘 Facebook Post — 1200 × 630</option>
<option value="cover">🖼️ Facebook Cover — 1640 × 856</option>
<option value="twitter">🐦 X Post — 1600 × 900</option>
<option value="landscape">🖥️ Landscape — 1200 × 630</option>
<option value="custom">⚙️ Custom Size</option>
</select>

</div>

<div id="customSize" style="display:none">

<div class="gradient-box">
<input type="number" id="customWidth" value="1080" placeholder="Width">
<input type="number" id="customHeight" value="1080" placeholder="Height">
</div>

</div>

<div class="size-info" id="sizeInfo">
1280 × 720 px
</div>

<div class="field">

<label>✍️ Main Text</label>

<textarea id="posterText">आपका शानदार Poster</textarea>

</div>

<div class="field">

<label>🔤 Font Style</label>

<select id="fontFamily">

<option value="Arial">Arial — Modern</option>

<option value="Georgia">Georgia — Classic</option>

<option value="Verdana">Verdana — Clean</option>

<option value="Trebuchet MS">Trebuchet MS — Stylish</option>

<option value="Courier New">Courier New — Typewriter</option>

<option value="Impact">Impact — Thumbnail</option>

<option value="Comic Sans MS">Comic Sans — Fun</option>

<option value="serif">Serif — Hindi Friendly</option>

<option value="sans-serif">Sans Serif — Hindi Friendly</option>

</select>

</div>

<div class="field">

<label>🔠 Font Size</label>

<input type="range" id="fontSize" min="20" max="180" value="70">

<div class="range-value" id="fontValue">70 px</div>

</div>

<div class="field">

<label>🎨 Text Color</label>

<div class="color-row">

<input type="color" id="textColor" value="#ffffff">

<input type="color" id="strokeColor" value="#000000">

</div>

<small>पहला = Text Color | दूसरा = Outline</small>

</div>

<div class="field">

<label>✨ Text Style</label>

<div class="style-grid">

<button class="style-btn" id="boldBtn" onclick="toggleBold()">𝐁 Bold</button>

<button class="style-btn" id="italicBtn" onclick="toggleItalic()">𝘐 Italic</button>

</div>

</div>

<div class="field">

<label>🖼️ अपनी Photo लगाएँ</label>

<input type="file" id="photoInput" accept="image/*">

</div>

<div class="field">

<label>🌈 Background</label>

<div class="bg-options">

<button class="bg-btn" onclick="setBg('#2563eb')">🔵 Blue</button>

<button class="bg-btn" onclick="setBg('#7c3aed')">🟣 Purple</button>

<button class="bg-btn" onclick="setBg('#dc2626')">🔴 Red</button>

<button class="bg-btn" onclick="setBg('#059669')">🟢 Green</button>

<button class="bg-btn" onclick="setBg('#f59e0b')">🟡 Orange</button>

<button class="bg-btn" onclick="setBg('#111827')">⚫ Black</button>

<button class="bg-btn" onclick="setBg('#ec4899')">💗 Pink</button>

</div>
</div>

<div class="field">

<label>🌈 Gradient Background</label>

<div class="gradient-box">

<input type="color" id="gradient1" value="#2563eb">

<input type="color" id="gradient2" value="#7c3aed">

</div>

<button class="style-btn" style="width:100%;margin-top:8px"
onclick="useGradient()">
✨ Gradient लगाएँ
</button>

</div>

<button class="btn generate" onclick="generatePoster()">
✨ Poster बनाएं
</button>

<button class="btn download" onclick="downloadPNG()">
⬇️ PNG Download
</button>

<button class="btn jpg" onclick="downloadJPG()">
🖼️ JPG Download
</button>

<button class="btn reset" onclick="resetPoster()">
🔄 Reset
</button>

</div>


<!-- PREVIEW -->

<div class="preview-card">

<h2>👀 Live Preview</h2>

<div class="canvas-box">

<canvas id="posterCanvas"
width="1280"
height="720"></canvas>

</div>

</div>

</div>
</div>

<footer>

<div>
⚡ Fast &nbsp; | &nbsp;
🔒 Private &nbsp; | &nbsp;
🆓 100% Free &nbsp; | &nbsp;
📱 Mobile Friendly
</div>

<div class="copyright">
© 2026 Tool Sathi — All Rights Reserved
</div>

</footer>


<script>

const canvas =
document.getElementById("posterCanvas");

const ctx =
canvas.getContext("2d");

let background = "#2563eb";

let useGradientBackground = false;

let uploadedImage = null;

let isBold = true;

let isItalic = false;


/* SIZE */

const sizes = {

youtube:[1280,720],

shorts:[1080,1920],

story:[1080,1920],

square:[1080,1080],

portrait:[1080,1350],

facebook:[1200,630],

cover:[1640,856],

twitter:[1600,900],

landscape:[1200,630]

};


document.getElementById("posterSize")
.addEventListener("change",function(){

const value = this.value;

if(value === "custom"){

document.getElementById("customSize")
.style.display="block";

setCanvasSize();

return;

}

document.getElementById("customSize")
.style.display="none";

setCanvasSize();

});


document.getElementById("customWidth")
.addEventListener("input",setCanvasSize);

document.getElementById("customHeight")
.addEventListener("input",setCanvasSize);


/* SET SIZE */

function setCanvasSize(){

const selected =
document.getElementById("posterSize").value;

let width;
let height;

if(selected === "custom"){

width =
Number(document.getElementById("customWidth").value) || 1080;

height =
Number(document.getElementById("customHeight").value) || 1080;

}else{

[width,height] = sizes[selected];

}

canvas.width=width;

canvas.height=height;

document.getElementById("sizeInfo")
.innerText =
width+" × "+height+" px";

generatePoster();

}


/* BACKGROUND */

function setBg(color){

background=color;

useGradientBackground=false;

generatePoster();

}


function useGradient(){

useGradientBackground=true;

generatePoster();

}


/* PHOTO */

document.getElementById("photoInput")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(event){

const img=new Image();

img.onload=function(){

uploadedImage=img;

generatePoster();

};

img.src=event.target.result;

};

reader.readAsDataURL(file);

});


/* TEXT STYLE */

function toggleBold(){

isBold=!isBold;

document.getElementById("boldBtn")
.classList.toggle("active",isBold);

generatePoster();

}


function toggleItalic(){

isItalic=!isItalic;

document.getElementById("italicBtn")
.classList.toggle("active",isItalic);

generatePoster();

}


/* GENERATE */

function generatePoster(){

setCanvasSizeWithoutLoop();

ctx.clearRect(0,0,canvas.width,canvas.height);


/* BACKGROUND */

if(useGradientBackground){

const g=ctx.createLinearGradient(
0,0,
canvas.width,
canvas.height
);

g.addColorStop(
0,
document.getElementById("gradient1").value
);

g.addColorStop(
1,
document.getElementById("gradient2").value
);

ctx.fillStyle=g;

}else{

ctx.fillStyle=background;

}

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* DARK OVERLAY */

const overlay=
ctx.createLinearGradient(
0,
0,
canvas.width,
canvas.height
);

overlay.addColorStop(
0,
"rgba(0,0,0,0.03)"
);

overlay.addColorStop(
1,
"rgba(0,0,0,0.35)"
);

ctx.fillStyle=overlay;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* PHOTO */

if(uploadedImage){

const maxWidth =
canvas.width*0.84;

const maxHeight =
canvas.height*0.48;

let w=uploadedImage.width;

let h=uploadedImage.height;

const ratio=Math.min(
maxWidth/w,
maxHeight/h
);

w*=ratio;

h*=ratio;

const x=(canvas.width-w)/2;

const y=50;

ctx.save();

ctx.beginPath();

const radius=30;

if(ctx.roundRect){

ctx.roundRect(
x,y,w,h,radius
);

}else{

ctx.rect(
x,y,w,h
);

}

ctx.clip();

ctx.drawImage(
uploadedImage,
x,y,w,h
);

ctx.restore();

}


/* TEXT */

const text=
document.getElementById("posterText")
.value ||
"आपका शानदार Poster";


const fontSize=
Number(
document.getElementById("fontSize").value
);

const fontFamily=
document.getElementById("fontFamily").value;


const fontWeight=
isBold ? "bold" : "normal";


const fontStyle=
isItalic ? "italic" : "normal";


ctx.font=
`${fontStyle} ${fontWeight} ${fontSize}px "${fontFamily}"`;


ctx.textAlign="center";

ctx.textBaseline="middle";


ctx.fillStyle=
document.getElementById("textColor").value;


ctx.strokeStyle=
document.getElementById("strokeColor").value;


ctx.lineWidth=
Math.max(3,fontSize/18);


ctx.shadowColor=
"rgba(0,0,0,.45)";

ctx.shadowBlur=8;

ctx.shadowOffsetX=2;

ctx.shadowOffsetY=3;


/* TEXT WRAP */

const maxTextWidth=
canvas.width*0.88;

const words=
text.split(/\s+/);

let lines=[];

let line="";


words.forEach(word=>{

const testLine=
line ? line+" "+word : word;

if(
ctx.measureText(testLine).width
>
maxTextWidth
){

if(line) lines.push(line);

line=word;

}else{

line=testLine;

}

});


if(line){

lines.push(line);

}


const lineHeight=
fontSize*1.25;


let startY=
canvas.height*0.70
-
((lines.length-1)*lineHeight)/2;


lines.forEach((lineText,index)=>{

const y=
startY+
index*lineHeight;


/* OUTLINE */

ctx.strokeText(
lineText,
canvas.width/2,
y
);


/* TEXT */

ctx.fillText(
lineText,
canvas.width/2,
y
);

});


/* BRAND */

ctx.shadowColor="transparent";

ctx.font=
"bold "+Math.max(22,fontSize*.38)+"px Arial";

ctx.fillStyle=
"rgba(255,255,255,.9)";

ctx.fillText(
"🔧 Tool Sathi",
canvas.width/2,
canvas.height-45
);

}


/* Prevent recursive setCanvasSize */

function setCanvasSizeWithoutLoop(){

const selected =
document.getElementById("posterSize").value;

if(selected==="custom"){

canvas.width=
Number(document.getElementById("customWidth").value)
||1080;

canvas.height=
Number(document.getElementById("customHeight").value)
||1080;

return;

}

const [w,h]=sizes[selected];

canvas.width=w;

canvas.height=h;

}


/* DOWNLOAD PNG */

function downloadPNG(){

generatePoster();

canvas.toBlob(function(blob){

const url=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=url;

link.download=
"tool-sathi-design.png";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

},"image/png");

}


/* DOWNLOAD JPG */

function downloadJPG(){

generatePoster();

const jpgCanvas=
document.createElement("canvas");

jpgCanvas.width=canvas.width;

jpgCanvas.height=canvas.height;

const jpgCtx=
jpgCanvas.getContext("2d");

jpgCtx.fillStyle="#ffffff";

jpgCtx.fillRect(
0,
0,
jpgCanvas.width,
jpgCanvas.height
);

jpgCtx.drawImage(
canvas,
0,
0
);

jpgCanvas.toBlob(function(blob){

const url=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=url;

link.download=
"tool-sathi-design.jpg";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

},"image/jpeg",0.95);

}


/* RESET */

function resetPoster(){

document.getElementById("posterText")
.value="आपका शानदार Poster";

document.getElementById("fontSize")
.value=70;

document.getElementById("fontFamily")
.value="Arial";

document.getElementById("textColor")
.value="#ffffff";

document.getElementById("strokeColor")
.value="#000000";

document.getElementById("posterSize")
.value="youtube";

document.getElementById("customSize")
.style.display="none";

background="#2563eb";

useGradientBackground=false;

uploadedImage=null;

document.getElementById("photoInput")
.value="";

isBold=true;

isItalic=false;

document.getElementById("boldBtn")
.classList.add("active");

document.getElementById("italicBtn")
.classList.remove("active");

setCanvasSize();

}


/* LIVE UPDATE */

document.getElementById("posterText")
.addEventListener(
"input",
generatePoster
);

document.getElementById("fontSize")
.addEventListener(
"input",
function(){

document.getElementById("fontValue")
.innerText=this.value+" px";

generatePoster();

}
);

document.getElementById("textColor")
.addEventListener(
"input",
generatePoster
);

document.getElementById("strokeColor")
.addEventListener(
"input",
generatePoster
);

document.getElementById("fontFamily")
.addEventListener(
"change",
generatePoster
);

document.getElementById("gradient1")
.addEventListener(
"input",
generatePoster
);

document.getElementById("gradient2")
.addEventListener(
"input",
generatePoster
);


/* INITIAL */

document.getElementById("boldBtn")
.classList.add("active");

setCanvasSize();

</script>

</body>
</html>
